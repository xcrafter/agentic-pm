# Every push to main: typecheck + build, run the end-to-end test against a throwaway local copy,
# then apply D1 migrations and deploy to Cloudflare. Pull requests run the checks only.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, build and end-to-end test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Local secrets for the test server (random, throwaway)
        run: |
          {
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "WEBHOOK_KEY_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "PUBLIC_URL=http://localhost:5173"
          } > .dev.vars

      - name: Fresh local database
        run: npm run db:migrate:local

      - name: Start the app locally
        run: |
          nohup npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:5173/api/me; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "app did not start"; cat vite.log; exit 1

      - name: End-to-end test (people, agents, MCP, webhooks)
        run: npm run e2e

      - name: Server log
        if: failure()
        run: tail -n 200 vite.log

  deploy:
    name: Migrate and deploy to Cloudflare
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://agentic-pm.impulze.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add a CLOUDFLARE_API_TOKEN repository secret (see README → Continuous deployment)."
            exit 1
          fi

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Build and deploy
        run: npm run deploy

      - name: Smoke test
        run: |
          curl -sf -o /dev/null https://agentic-pm.impulze.workers.dev/
          curl -sf https://agentic-pm.impulze.workers.dev/api/me > /dev/null
          echo "live"
